<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Privacy Control</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background:#0a0a0a;
    color:#fff;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

/* HEADER */
.header{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:20px 40px;
    background:rgba(20,20,20,0.9);
    position:relative;
    z-index:100;
}

/* PROFILE */
.profile-dropdown{position:relative;margin-left:20px;}
.profile-icon{
    width:50px;height:50px;
    border-radius:50%;
    background:linear-gradient(135deg,#00ff92,#00cc73);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:22px;
}
.dropdown-menu{
    position:absolute;
    top:60px;right:0;
    background:#1a1a1a;
    border-radius:10px;
    padding:10px 0;
    display:none;
}
.dropdown-menu.active{display:block;}
.dropdown-item{
    padding:10px 20px;
    cursor:pointer;
}
.dropdown-item:hover{background:#00ff92;color:#000;}

/* CONTAINER */
.container{
    max-width:1000px;
    margin:50px auto;
    padding:0 20px;
}
h1{text-align:center;color:#00ff92;margin-bottom:40px;}

/* APP ROW */
.app-row{
    background:#141414;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border:1px solid rgba(0,255,146,0.3);
}
.app-info{
    display:flex;
    align-items:center;
    gap:20px;
}
.app-icon{
    width:60px;height:60px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
}
.telegram{background:#229ED9;}
.instagram{background:#E1306C;}
.tiktok{background:#111;}
.ai{background:#00ff92;color:#000;}
.grammarly{background:#15C39A;}
.access{background:#A4373A;}
.canva{background:#7C2AE8;}

.app-name{font-size:1.2rem;font-weight:bold;}

/* BUTTON */
.info-btn,.reboot-btn{
    padding:8px 20px;
    border-radius:20px;
    border:2px solid #00ff92;
    background:transparent;
    color:#00ff92;
    cursor:pointer;
}
.info-btn:hover,.reboot-btn:hover{
    background:#00ff92;
    color:#000;
}

/* PERMISSION DROPDOWN */
.btn-wrapper{position:relative;}
.permission-dropdown{
    position:absolute;
    top:45px;
    right:0;
    background:#1f1f1f;
    padding:15px;
    border-radius:10px;
    display:none;
    min-width:250px;
    border:1px solid #00ff92;
}
.permission-dropdown.active{display:block;}

.permission-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    background:#262626;
    padding:8px;
    border-radius:8px;
}
.revoke-btn{
    background:#ff3b3b;
    border:none;
    padding:4px 12px;
    border-radius:15px;
    color:#fff;
    cursor:pointer;
}
.revoke-btn:hover{background:#ff6666;}

/* REBOOT DROPDOWN */
.reboot-wrapper{position:relative;}
.reboot-dropdown{
    position:absolute;
    top:50px;
    right:0;
    background:#1f1f1f;
    padding:15px;
    border-radius:10px;
    display:none;
    min-width:300px;
    border:1px solid #00ff92;
}
.reboot-dropdown.active{display:block;}

.backdrop{
    position:fixed;
    inset:0;
    display:none;
}
.backdrop.active{display:block;}
</style>
</head>

<body>

<div class="backdrop" id="backdrop"></div>

<div class="header">
    <div class="reboot-wrapper">
        <button class="reboot-btn" id="rebootBtn">🔄 Reboot</button>
        <div class="reboot-dropdown" id="rebootDropdown">
            <strong style="color:#00ff92;">Revoke Features</strong>
        </div>
    </div>

    <div class="profile-dropdown">
        <div class="profile-icon" id="profileIcon">👤</div>
        <div class="dropdown-menu" id="profileMenu">
            <div class="dropdown-item">Profile Info</div>
            <div class="dropdown-item">Settings</div>
        </div>
    </div>
</div>

<div class="container">
<h1>Privacy Dashboard</h1>

<script>
const apps = [
"Telegram","Instagram","TikTok",
"AI Assistant","Grammarly",
"Microsoft Access","Canva"
];

const icons = ["✈️","📷","🎵","🤖","✍️","📊","🎨"];
const classes = ["telegram","instagram","tiktok","ai","grammarly","access","canva"];

apps.forEach((app,index)=>{
    const row = document.createElement("div");
    row.className="app-row";
    row.innerHTML=`
        <div class="app-info">
            <div class="app-icon ${classes[index]}">${icons[index]}</div>
            <div class="app-name">${app}</div>
        </div>
        <div class="btn-wrapper">
            <button class="info-btn">INFO</button>
            <div class="permission-dropdown">
                <div class="permission-item">
                    <span>🎤 Microphone</span>
                    <button class="revoke-btn">Revoke</button>
                </div>
                <div class="permission-item">
                    <span>📷 Camera</span>
                    <button class="revoke-btn">Revoke</button>
                </div>
            </div>
        </div>
    `;
    document.querySelector(".container").appendChild(row);
});
</script>

<script>
const backdrop=document.getElementById("backdrop");

/* PROFILE */
document.getElementById("profileIcon").onclick=()=>{
    document.getElementById("profileMenu").classList.toggle("active");
};

/* INFO BUTTONS */
document.querySelectorAll(".info-btn").forEach(btn=>{
    btn.onclick=()=>{
        document.querySelectorAll(".permission-dropdown").forEach(d=>d.classList.remove("active"));
        btn.nextElementSibling.classList.toggle("active");
        backdrop.classList.add("active");
    };
});

/* REBOOT BUTTON */
document.getElementById("rebootBtn").onclick=()=>{
    document.getElementById("rebootDropdown").classList.toggle("active");
    backdrop.classList.add("active");
};

/* CLOSE ON BACKDROP */
backdrop.onclick=()=>{
    document.querySelectorAll(".permission-dropdown").forEach(d=>d.classList.remove("active"));
    document.getElementById("rebootDropdown").classList.remove("active");
    backdrop.classList.remove("active");
};

/* REVOKE */
document.addEventListener("click",e=>{
    if(e.target.classList.contains("revoke-btn")){
        e.target.closest(".permission-item").remove();
    }
});
</script>

</body>
</html>
